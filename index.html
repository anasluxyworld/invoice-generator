<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ANAS LUXY WORLD — Invoice Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#f9fafb; --bg-card:#ffffff; --border:#e5e7eb; --text:#111827; --text-dim:#6b7280; --text-dimmer:#9ca3af;
    --accent:#4f46e5; --accent-hover:#4338ca; --accent-light:#eef2ff;
    --rose:#e11d48; --rose-light:#fff1f2; --rose-text:#e11d48;
    --amber:#d97706; --amber-light:#fffbeb;
    --emerald:#059669; --emerald-light:#ecfdf5;
    --violet:#7c3aed; --violet-light:#f5f3ff;
    --gray-badge:#6b7280; --gray-badge-light:#f3f4f6;
    --shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  html.dark{
    --bg:#0f172a; --bg-card:#1e293b; --border:#334155; --text:#f1f5f9; --text-dim:#94a3b8; --text-dimmer:#64748b;
    --accent:#6366f1; --accent-hover:#818cf8; --accent-light:rgba(99,102,241,0.18);
    --rose-light:rgba(225,29,72,0.15);
    --amber-light:rgba(217,119,6,0.15);
    --emerald-light:rgba(5,150,105,0.15);
    --violet-light:rgba(124,58,237,0.15);
    --gray-badge-light:rgba(148,163,184,0.18);
  }
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;transition:background .15s;}
  button,input,select,textarea{font-family:inherit;}
  .app{min-height:100vh;display:flex;flex-direction:column;}
  @media(min-width:900px){.app{flex-direction:row;}}

  /* Sidebar */
  .sidebar{display:none;}
  @media(min-width:900px){
    .sidebar{display:flex;flex-direction:column;width:240px;flex-shrink:0;border-right:1px solid var(--border);background:var(--bg-card);height:100vh;position:sticky;top:0;}
  }
  .brand{display:flex;align-items:center;gap:10px;padding:22px 18px;}
  .brand-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0;}
  .brand-name{font-weight:700;font-size:13px;line-height:1.2;}
  .brand-tag{font-size:10.5px;color:var(--text-dimmer);line-height:1.2;}
  .nav{flex:1;padding:0 12px;display:flex;flex-direction:column;gap:4px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--text-dim);background:none;border:none;cursor:pointer;text-align:left;width:100%;}
  .nav-item:hover{background:var(--bg);}
  .nav-item.active{background:var(--accent-light);color:var(--accent);}
  .side-bottom{padding:12px;}

  /* Cloud status */
  .cloud-status{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-dimmer);margin-top:3px;}
  .cloud-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .cloud-dot.on{background:#10b981;}
  .cloud-dot.off{background:#f59e0b;}
  .cloud-dot.checking{background:var(--text-dimmer);}

  /* Mobile top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--bg-card);position:sticky;top:0;z-index:30;}
  @media(min-width:900px){.topbar{display:none;}}
  .topbar-left{display:flex;align-items:center;gap:8px;}
  .icon-btn{background:none;border:none;cursor:pointer;color:var(--text-dim);padding:8px;border-radius:8px;display:flex;align-items:center;}
  .icon-btn:hover{background:var(--bg);}
  .mobile-drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:40;}
  @media(min-width:900px){.mobile-drawer-overlay{display:none;}}
  .mobile-drawer{position:absolute;right:0;top:0;height:100%;width:260px;background:var(--bg-card);padding:16px;box-shadow:-4px 0 20px rgba(0,0,0,0.2);}

  main.content{flex:1;min-width:0;padding:18px;padding-bottom:60px;}
  @media(min-width:640px){main.content{padding:24px;}}
  @media(min-width:1024px){main.content{padding:32px;}}

  h1.page-title{font-size:21px;font-weight:700;margin:0 0 4px;}
  @media(min-width:640px){h1.page-title{font-size:24px;}}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:9px 16px;font-size:13.5px;font-weight:600;border:none;cursor:pointer;transition:transform .05s,opacity .15s;white-space:nowrap;}
  .btn:active{transform:scale(0.96);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-hover);}
  .btn-secondary{background:var(--bg);color:var(--text);}
  html.dark .btn-secondary{background:#334155;color:var(--text);}
  .btn-secondary:hover{filter:brightness(0.96);}
  .btn-danger{background:var(--rose-light);color:var(--rose-text);}
  .btn-danger:hover{filter:brightness(0.95);}
  .btn-ghost{background:none;color:var(--text-dim);}

  /* Form atoms */
  .label{display:block;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--text-dimmer);margin-bottom:6px;}
  .input,.select,.textarea{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-size:13.5px;outline:none;}
  .input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light);}
  .input:disabled{opacity:.65;}
  .field{margin-bottom:0;}

  /* Card */
  .card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;}
  .card-pad{padding:18px;}
  @media(min-width:640px){.card-pad{padding:20px;}}

  /* Badge */
  .badge{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap;}
  .badge-draft{background:var(--gray-badge-light);color:var(--gray-badge);}
  .badge-unpaid{background:var(--rose-light);color:var(--rose);}
  .badge-partial{background:var(--amber-light);color:var(--amber);}
  .badge-paid{background:var(--emerald-light);color:var(--emerald);}

  /* Modal */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;}
  .modal{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3);}
  .modal.wide{max-width:680px;}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg-card);}
  .modal-title{font-weight:700;font-size:15px;margin:0;}
  .modal-body{padding:20px;}

  /* Toasts */
  .toast-stack{position:fixed;bottom:16px;right:16px;z-index:100;display:flex;flex-direction:column;gap:8px;max-width:280px;}
  .toast{padding:11px 16px;border-radius:12px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,0.2);animation:fadein .2s ease;}
  .toast.success{background:#059669;}
  .toast.error{background:#dc2626;}
  @keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* Stat cards */
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(min-width:1024px){.stat-grid{grid-template-columns:repeat(4,1fr);gap:16px;}}
  .stat-icon{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
  .stat-label{font-size:11.5px;font-weight:500;color:var(--text-dim);margin-bottom:4px;}
  .stat-value{font-size:19px;font-weight:700;letter-spacing:-0.02em;}
  @media(min-width:640px){.stat-value{font-size:22px;}}

  /* Empty state */
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 16px;text-align:center;}
  .empty-icon{padding:16px;border-radius:18px;background:var(--bg);color:var(--text-dimmer);margin-bottom:12px;}
  .empty-title{font-weight:600;margin-bottom:4px;}
  .empty-sub{font-size:13px;color:var(--text-dimmer);}

  /* Grids */
  .grid-2{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:640px){.grid-2{grid-template-columns:1fr 1fr;}}
  .grid-3{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:640px){.grid-3{grid-template-columns:1fr 1fr;}}
  @media(min-width:1024px){.grid-3{grid-template-columns:1fr 1fr 1fr;}}
  .grid-form2{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:640px){.grid-form2{grid-template-columns:1fr 1fr;}}
  .grid-form3{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:640px){.grid-form3{grid-template-columns:1fr 1fr 1fr;}}
  .span-2{grid-column:span 2;}

  /* Table */
  .table-wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead tr{border-bottom:1px solid var(--border);}
  th{text-align:left;padding:12px 16px;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text-dimmer);}
  tbody tr{border-bottom:1px solid var(--border);}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:var(--bg);}
  td{padding:12px 16px;}

  .row-actions{display:flex;gap:2px;justify-content:flex-end;}

  /* Invoice items row */
  .item-row{padding:12px;border:1px solid var(--border);border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  @media(min-width:640px){.item-row{grid-template-columns:repeat(12,1fr);}}
  .col-4{grid-column:span 2;}
  @media(min-width:640px){.col-4{grid-column:span 4;}}
  .col-1{grid-column:span 1;}
  .col-2{grid-column:span 1;}
  @media(min-width:640px){.col-2{grid-column:span 2;}}

  .preset-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .preset-btn{padding:7px 13px;border-radius:9px;font-size:11.5px;font-weight:700;border:1px solid var(--border);background:none;color:var(--text-dim);cursor:pointer;}
  .preset-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .totals-strip{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:13.5px;}
  @media(min-width:640px){.totals-strip{grid-template-columns:1fr 1fr 1fr;}}

  /* Charts */
  .chart-svg{width:100%;height:230px;}
  .chart-bar{fill:var(--accent);}
  .chart-label{font-size:5.5px;fill:var(--text-dim);}
  .donut-wrap{display:flex;flex-direction:column;align-items:center;}
  .donut-svg{width:160px;height:160px;}
  .legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:10px;}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);}
  .legend-dot{width:9px;height:9px;border-radius:50%;}

  /* Toggle switch */
  .toggle{width:40px;height:23px;border-radius:999px;background:var(--border);border:none;cursor:pointer;position:relative;padding:0;flex-shrink:0;transition:background .15s;}
  .toggle.on{background:var(--accent);}
  .toggle-knob{position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
  .toggle.on .toggle-knob{transform:translateX(17px);}

  /* Payment method rows in settings */
  .pm-row{padding:14px 0;border-bottom:1px solid var(--border);}
  .pm-row:last-child{border-bottom:none;}
  .pm-row-top{display:flex;align-items:center;justify-content:space-between;}
  .pm-label-group{display:flex;align-items:center;gap:10px;}
  .pm-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .pm-label{font-weight:600;font-size:13.5px;}
  .pm-detail{margin-top:12px;padding:14px;border-radius:12px;background:var(--bg);display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;}

  /* Invoice preview (print template) — fixed professional dark+yellow styling regardless of app theme */
  .invoice-preview{background:#ffffff;color:#1f2937;border-radius:14px;border:1px solid #e5e7eb;padding:0;max-width:800px;margin:0 auto;font-family:inherit;overflow:hidden;position:relative;}
  .inv-head{background:#1c1c22;color:#fff;padding:24px 32px;position:relative;overflow:hidden;}
  @media(min-width:640px){.inv-head{padding:30px 48px;}}
  .inv-head-row{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;position:relative;z-index:2;}
  .inv-curve{position:absolute;left:0;right:0;bottom:-1px;width:100%;z-index:1;height:46px;display:block;}
  .inv-head-left{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;}
  .inv-logo{height:62px;width:auto;max-width:160px;object-fit:contain;flex-shrink:0;display:block;}
  @media(min-width:640px){.inv-logo{height:74px;}}
  .inv-logo-fallback{width:54px;height:54px;border-radius:8px;background:#f5b400;display:flex;align-items:center;justify-content:center;color:#1c1c22;font-weight:800;font-size:20px;flex-shrink:0;}
  .inv-biz-name{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:17px;letter-spacing:.03em;color:#fff;line-height:1;text-align:center;margin:0;}
  @media(min-width:640px){.inv-biz-name{font-size:19px;}}
  .inv-tag{font-size:10px;color:#9ca3af;font-style:italic;text-align:center;line-height:1;margin:0;}
  .inv-head-meta{display:flex;gap:26px;font-size:11px;color:#fff;padding-top:4px;}
  .inv-head-meta-col div:first-child{color:#f5b400;font-weight:700;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px;}
  .inv-head-meta-col div:last-child{line-height:1.5;color:#d1d5db !important;}
  .inv-head-meta-col{max-width:170px;}
  .inv-body{padding:30px 32px 30px;position:relative;z-index:2;background:#fff;}
  @media(min-width:640px){.inv-body{padding:38px 48px 38px;}}
  .inv-tobox-row{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:16px;margin-bottom:22px;}
  .inv-to-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#9ca3af;margin-bottom:5px;}
  .inv-to-name{font-weight:700;font-size:14.5px;color:#1c1c22;text-transform:uppercase;}
  .inv-title{font-size:32px;font-weight:800;letter-spacing:.02em;text-align:right;color:#1c1c22;}
  .inv-details{font-size:12.5px;color:#6b7280;text-align:right;margin-top:8px;line-height:1.7;}
  .inv-details b{color:#1c1c22;font-weight:600;}
  .inv-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#b8860b;margin-bottom:6px;}
  .inv-table{width:100%;font-size:13.5px;border-collapse:collapse;}
  .inv-table thead tr{background:#f5b400;}
  .inv-table th{padding:11px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#1c1c22;text-align:left;font-weight:700;}
  .inv-table th.th-num{background:#3a3a42;color:#fff;text-align:right;}
  .inv-table td{padding:13px 14px;border-bottom:1px solid #ececec;color:#374151 !important;vertical-align:top;}
  .inv-table tbody tr:nth-child(even){background:#f3f4f5;}
  .inv-item-desc{font-size:11px;color:#9ca3af;margin-top:2px;}
  .inv-bottom-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-top:18px;flex-wrap:wrap;}
  .inv-bottom-left{flex:1 1 240px;min-width:0;}
  .inv-bottom-right{flex:1 1 240px;min-width:0;}
  .inv-summary{display:flex;flex-direction:column;gap:2px;}
  .inv-summary-row{display:flex;justify-content:space-between;font-size:13px;color:#6b7280;padding:2px 0;}
  .inv-summary-row.due{font-weight:700;color:#dc2626;}
  .inv-total-bar{display:flex;justify-content:space-between;align-items:center;background:#f5b400;padding:14px 20px;border-radius:4px;margin-top:10px;}
  .inv-total-bar span:first-child{font-weight:800;font-size:13.5px;color:#1c1c22;letter-spacing:.04em;text-transform:uppercase;}
  .inv-total-bar span:last-child{font-weight:800;font-size:18px;color:#1c1c22;}
  .inv-pay-box{padding:0;border-radius:0;background:transparent;border:none;display:block;color:#374151;}
  .inv-qr{width:74px;height:74px;object-fit:contain;border:1px solid #e5e7eb;border-radius:8px;background:#fff;flex-shrink:0;}
  .inv-footer{display:flex;align-items:flex-end;justify-content:space-between;margin-top:30px;padding-top:18px;}
  .inv-sig{height:42px;object-fit:contain;}
  .inv-thankyou{font-weight:700;color:#1c1c22;font-size:14.5px;}
  .inv-terms{font-size:11px;color:#9ca3af;margin-top:4px;max-width:320px;}

  /* Print rules — hide app chrome, header/footer, urls, page numbers as much as CSS allows */
  @media print{
    body *{visibility:hidden;}
    .invoice-preview,.invoice-preview *{visibility:visible;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}
    .invoice-preview{position:absolute;top:0;left:0;width:100%;border:none !important;border-radius:0 !important;}
    .no-print{display:none !important;}
  }
  @page{size:A4;margin:0;}

  .upload-row{display:flex;align-items:center;gap:12px;}
  .thumb{width:64px;height:64px;border-radius:12px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
  .thumb img{width:100%;height:100%;object-fit:contain;}
  .upload-label{cursor:pointer;font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px;background:var(--bg);}
  html.dark .upload-label{background:#334155;}

  .filters-bar{display:grid;grid-template-columns:1fr;gap:8px;}
  @media(min-width:640px){.filters-bar{grid-template-columns:2fr 1fr 1fr 1.2fr;}}
  .search-wrap{position:relative;}
  .search-wrap .search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-dimmer);}
  .search-wrap input{padding-left:34px;}

  .loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-dimmer);font-size:14px;}

  /* Bulk export selection bar */
  .bulk-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--accent-light);border:1px solid var(--accent);margin-bottom:2px;}
  .bulk-bar-left{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--accent);}
  .select-checkbox{width:17px;height:17px;cursor:pointer;accent-color:var(--accent);}

  /* Hidden offscreen container used to render invoices for bulk PDF export */
  .bulk-export-stage{position:fixed;left:-99999px;top:0;width:800px;z-index:-1;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

/* ---------------------------------- cloud storage (Supabase) ---------------------------------- */
/* All data is stored in a Supabase table called "app_storage" (key text primary key, value jsonb).
   This makes the app's data identical across every device/browser. localStorage is only used as a
   read fallback if the network/Supabase is unreachable, so the app still opens offline. */

const SUPABASE_URL = 'https://gzyyqghcegqjufcmyyrd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5xMIzNYeL3BhOa9NpgyHUQ_4YiQQdpP';
const SUPABASE_TABLE = `${SUPABASE_URL}/rest/v1/app_storage`;
const supabaseHeaders = {
  apikey: SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json'
};

let cloudOnline = null; // null = unknown yet, true/false once we know

const storageAdapter = {
  async get(key) {
    try {
      const res = await fetch(`${SUPABASE_TABLE}?key=eq.${encodeURIComponent(key)}&select=value`, { headers: supabaseHeaders });
      if (!res.ok) throw new Error('Supabase get failed: ' + res.status);
      const rows = await res.json();
      cloudOnline = true;
      if (!rows.length) return null;
      const value = JSON.stringify(rows[0].value);
      localStorage.setItem(key, value); // keep an offline cache
      return { value };
    } catch (e) {
      cloudOnline = false;
      const v = localStorage.getItem(key);
      return v !== null ? { value: v } : null;
    }
  },
  async set(key, value) {
    localStorage.setItem(key, value); // always cache locally first
    try {
      const res = await fetch(`${SUPABASE_TABLE}?on_conflict=key`, {
        method: 'POST',
        headers: { ...supabaseHeaders, Prefer: 'resolution=merge-duplicates,return=minimal' },
        body: JSON.stringify([{ key, value: JSON.parse(value), updated_at: new Date().toISOString() }])
      });
      if (!res.ok) throw new Error('Supabase set failed: ' + res.status);
      cloudOnline = true;
      return { value };
    } catch (e) {
      cloudOnline = false;
      return { value };
    }
  },
  getCloudStatus() { return cloudOnline; }
};

function uid(prefix) {
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);

function formatBDT(n) {
  const num = Number(n) || 0;
  return 'Tk ' + num.toLocaleString('en-IN', { maximumFractionDigits: 2 });
}
function todayISO() { return new Date().toISOString().slice(0, 10); }
function formatDateDisplay(d) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt.getTime())) return d;
  return dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
}
function generateInvoiceNumber(invoices) {
  const year = new Date().getFullYear();
  const nums = invoices
    .filter(i => i.invoiceNumber && i.invoiceNumber.includes(String(year)))
    .map(i => {
      const m = i.invoiceNumber.match(/(\d+)$/);
      return m ? parseInt(m[1], 10) : 0;
    });
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `INV-${year}-${String(next).padStart(4, '0')}`;
}
function computeTotals(items, discount, deliveryCharge, additionalCharges, advancePaid) {
  const subtotal = items.reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.unitPrice) || 0), 0);
  const grandTotal = subtotal - (Number(discount) || 0) + (Number(deliveryCharge) || 0) + (Number(additionalCharges) || 0);
  const dueAmount = grandTotal - (Number(advancePaid) || 0);
  return { subtotal, grandTotal, dueAmount };
}

}

/* ---------------------------------- simple charts ---------------------------------- */

function BarChartSVG({ data }) {
  const max = Math.max(1, ...data.map(d => d.revenue));
  const w = 600, h = 230, padBottom = 26, padTop = 10;
  const gap = w / data.length;
  const barW = gap * 0.5;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} className="chart-svg" preserveAspectRatio="xMidYMid meet">
      {data.map((d, i) => {
        const barH = max ? (d.revenue / max) * (h - padBottom - padTop) : 0;
        const x = i * gap + (gap - barW) / 2;
        const y = h - padBottom - barH;
        return (
          <g key={i}>
            <rect x={x} y={y} width={barW} height={Math.max(barH, 2)} rx="5" className="chart-bar">
              <title>{d.month}: {formatBDT(d.revenue)}</title>
            </rect>
            <text x={x + barW / 2} y={h - 8} textAnchor="middle" className="chart-label" style={{ fontSize: 9 }}>{d.month}</text>
          </g>
        );
      })}
    </svg>
  );
}

function DonutChart({ data }) {
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const r = 40, c = 2 * Math.PI * r;
  let offset = 0;
  return (
    <div className="donut-wrap">
      <svg viewBox="0 0 100 100" className="donut-svg">
        <g transform="rotate(-90 50 50)">
          <circle cx="50" cy="50" r={r} fill="none" stroke="var(--border)" strokeWidth="14" />
          {data.map((d, i) => {
            const frac = d.value / total;
            const dash = frac * c;
            const seg = (
              <circle key={i} cx="50" cy="50" r={r} fill="none" stroke={d.color} strokeWidth="14"
                strokeDasharray={`${dash} ${c - dash}`} strokeDashoffset={-offset}>
                <title>{d.name}: {d.value}</title>
              </circle>
            );
            offset += dash;
            return seg;
          })}
        </g>
      </svg>
      <div className="legend">
        {data.map(d => (
          <div key={d.name} className="legend-item">
            <span className="legend-dot" style={{ background: d.color }} />{d.name}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------------------------- Dashboard ---------------------------------- */

function Dashboard({ invoices }) {
  const stats = useMemo(() => {
    const today = todayISO();
    const monthKey = today.slice(0, 7);
    const billable = invoices.filter(i => i.status !== 'Draft');

    const todaysSales = billable.filter(i => i.date === today).reduce((s, i) => s + i.grandTotal, 0);
    const monthSales = billable.filter(i => (i.date || '').slice(0, 7) === monthKey).reduce((s, i) => s + i.grandTotal, 0);
    const outstandingDue = invoices.filter(i => i.status === 'Unpaid' || i.status === 'Partially Paid').reduce((s, i) => s + i.dueAmount, 0);
    const totalPaidRevenue = billable.reduce((s, i) => s + (i.grandTotal - i.dueAmount), 0);

    const productTotals = {};
    billable.forEach(inv => inv.items.forEach(it => {
      const key = it.description || 'Item';
      productTotals[key] = (productTotals[key] || 0) + (Number(it.qty) || 0);
    }));
    const topProducts = Object.entries(productTotals).sort((a, b) => b[1] - a[1]).slice(0, 5);

    const recent = [...invoices].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 5);

    const monthly = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date(); d.setMonth(d.getMonth() - i);
      const key = d.toISOString().slice(0, 7);
      const label = d.toLocaleDateString('en-US', { month: 'short' });
      const total = billable.filter(inv => (inv.date || '').slice(0, 7) === key).reduce((s, inv) => s + inv.grandTotal, 0);
      monthly.push({ month: label, revenue: total });
    }

    const colorMap = { Draft: '#94a3b8', Unpaid: '#fb7185', 'Partially Paid': '#f59e0b', Paid: '#10b981' };
    const statusDist = STATUS_LIST
      .map(s => ({ name: s, value: invoices.filter(i => i.status === s).length, color: colorMap[s] }))
      .filter(s => s.value > 0);

    return { todaysSales, monthSales, outstandingDue, totalPaidRevenue, topProducts, recent, monthly, statusDist };
  }, [invoices]);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
      <h1 className="page-title">Dashboard</h1>

      <div className="stat-grid">
        <StatCard icon="trending" label="Today's Sales" value={formatBDT(stats.todaysSales)} bg="var(--accent-light)" color="var(--accent)" />
        <StatCard icon="wallet" label="This Month's Sales" value={formatBDT(stats.monthSales)} bg="var(--violet-light)" color="var(--violet)" />
        <StatCard icon="clock" label="Outstanding Due" value={formatBDT(stats.outstandingDue)} bg="var(--rose-light)" color="var(--rose)" />
        <StatCard icon="checkCircle" label="Total Paid Revenue" value={formatBDT(stats.totalPaidRevenue)} bg="var(--emerald-light)" color="var(--emerald)" />
      </div>

      <div className="grid-3">
        <Card className="card-pad" style={{ gridColumn: 'span 2' }}>
          <h3 style={{ fontSize: 13.5, fontWeight: 700, margin: '0 0 16px' }}>Monthly Revenue</h3>
          <BarChartSVG data={stats.monthly} />
        </Card>
        <Card className="card-pad">
          <h3 style={{ fontSize: 13.5, fontWeight: 700, margin: '0 0 10px' }}>Invoice Status</h3>
          {stats.statusDist.length === 0
            ? <div style={{ fontSize: 13, color: 'var(--text-dimmer)', textAlign: 'center', padding: '40px 0' }}>No invoices yet</div>
            : <DonutChart data={stats.statusDist} />}
        </Card>
      </div>

      <div className="grid-2">
        <Card className="card-pad">
          <h3 style={{ fontSize: 13.5, fontWeight: 700, margin: '0 0 12px' }}>Top Selling Products</h3>
          {stats.topProducts.length === 0
            ? <div style={{ fontSize: 13, color: 'var(--text-dimmer)', textAlign: 'center', padding: '20px 0' }}>No sales data yet</div>
            : <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {stats.topProducts.map(([name, qty], i) => (
                  <div key={name} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
                      <span style={{ width: 24, height: 24, borderRadius: 8, background: 'var(--bg)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 11, fontWeight: 700, flexShrink: 0 }}>{i + 1}</span>
                      <span style={{ fontSize: 13.5, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{name}</span>
                    </div>
                    <span style={{ fontSize: 13.5, fontWeight: 700, flexShrink: 0 }}>{qty} sold</span>
                  </div>
                ))}
              </div>}
        </Card>
        <Card className="card-pad">
          <h3 style={{ fontSize: 13.5, fontWeight: 700, margin: '0 0 12px' }}>Recent Invoices</h3>
          {stats.recent.length === 0
            ? <div style={{ fontSize: 13, color: 'var(--text-dimmer)', textAlign: 'center', padding: '20px 0' }}>No invoices yet</div>
            : <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {stats.recent.map(inv => (
                  <div key={inv.id} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <div style={{ minWidth: 0 }}>
                      <div style={{ fontSize: 13.5, fontWeight: 600, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{inv.invoiceNumber}</div>
                      <div style={{ fontSize: 11.5, color: 'var(--text-dimmer)' }}>{inv.customerSnapshot.name || 'No customer'}</div>
                    </div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexShrink: 0 }}>
                      <span style={{ fontSize: 13.5, fontWeight: 700 }}>{formatBDT(inv.grandTotal)}</span>
                      <Badge status={inv.status} />
                    </div>
                  </div>
                ))}
              </div>}
        </Card>
      </div>
    </div>
  );
}

function SettingsPage({ settings, onSave, addToast }) {
  const [form, setForm] = useState(settings);
  const update = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const updateMobile = (key, field, value) => setForm(f => ({
    ...f, mobilePayments: { ...f.mobilePayments, [key]: { ...f.mobilePayments[key], [field]: value } }
  }));
  const handleFile = (key) => (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => update(key, reader.result);
    reader.readAsDataURL(file);
  };
  const handleMobileQR = (key) => (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => updateMobile(key, 'qr', reader.result);
    reader.readAsDataURL(file);
  };
  const save = () => { onSave(form); addToast('Settings saved'); };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16, maxWidth: 760 }}>
      <h1 className="page-title">Settings</h1>

      <Card className="card-pad">
        <h3 style={{ fontSize: 13.5, fontWeight: 700, margin: '0 0 16px' }}>Business Information</h3>
        <div className="grid-form2">
          <Field label="Business Name"><Input value={form.businessName} onChange={e => update('businessName', e.target.value)} /></Field>
          <Field label="Tagline"><Input value={form.tagline} onChange={e => update('tagline', e.target.value)} /></Field>
          <Field label="Owner"><Input value={form.owner} onChange={e => update('owner', e.target.value)} /></Field>
          <Field label="Email"><Input value={form.email} onChange={e => update('email', e.target.value)} /></Field>
          <Field label="Phone"><Input value={form.phone} onChange={e => update('phone', e.target.value)} /></Field>
          <Field label="Website"><Input value={form.website} onChange={e => update('website', e.target.value)} /></Field>
          <div className="span-2"><Field label="Address"><TextArea rows={2} value={form.address} onChange={e => update('address', e.target.value)} /></Field></div>
        </div>
      </Card>

      <Card className="card-pad">
        <h3 style={{ fontSize: 13.5, fontWeight: 700, margin: '0 0 16px' }}>Logo & Signature</h3>
        <div className="grid-form2">
          <div>
            <Label>Logo</Label>
            <div className="upload-row">
              <div className="thumb">{form.logo ? <img src={form.logo} /> : <Icon name="upload" size={18} />}</div>
              <label className="upload-label">Upload<input type="file" accept="image/*" style={{ display: 'none' }} onChange={handleFile('logo')} /></label>
            </div>
          </div>
          <div>
            <Label>Signature</Label>
            <div className="upload-row">
              <div className="thumb">{form.signature ? <img src={form.signature} /> : <Icon name="upload" size={18} />}</div>
              <label className="upload-label">Upload<input type="file" accept="image/*" style={{ display: 'none' }} onChange={handleFile('signature')} /></label>
            </div>
          </div>
        </div>
      </Card>

      <Card className="card-pad">
        <h3 style={{ fontSize: 13.5, fontWeight: 700, margin: '0 0 4px' }}>Payment Methods</h3>
        <p style={{ fontSize: 12, color: 'var(--text-dimmer)', margin: '0 0 6px' }}>Turn on the payment options you accept. Only enabled methods appear on invoices.</p>

        <div className="pm-row">
          <div className="pm-row-top">
            <div className="pm-label-group"><span className="pm-dot" style={{ background: '#10b981' }} /><span className="pm-label">Cash</span></div>
            <Toggle checked={form.cashEnabled !== false} onChange={v => update('cashEnabled', v)} />
          </div>
        </div>

        <div className="pm-row">
          <div className="pm-row-top">
            <div className="pm-label-group"><span className="pm-dot" style={{ background: '#4f46e5' }} /><span className="pm-label">Bank Transfer</span></div>
            <Toggle checked={form.bankEnabled !== false} onChange={v => update('bankEnabled', v)} />
          </div>
          {form.bankEnabled !== false && <p style={{ fontSize: 11.5, color: 'var(--text-dimmer)', margin: '8px 0 0' }}>Fill in your bank account details below.</p>}
        </div>

        {MOBILE_PAYMENT_DEFS.map(def => {
          const m = form.mobilePayments[def.key];
          return (
            <div key={def.key} className="pm-row">
              <div className="pm-row-top">
                <div className="pm-label-group"><span className="pm-dot" style={{ background: def.color }} /><span className="pm-label">{def.label}</span></div>
                <Toggle checked={!!m.enabled} onChange={v => updateMobile(def.key, 'enabled', v)} />
              </div>
              {m.enabled && (
                <div className="pm-detail">
                  <div style={{ flex: '1 1 180px' }}>
                    <Label>{def.label} Number</Label>
                    <Input value={m.number} onChange={e => updateMobile(def.key, 'number', e.target.value)} placeholder="01XXXXXXXXX" />
                  </div>
                  <div>
                    <Label>QR Code</Label>
                    <div className="upload-row">
                      <div className="thumb">{m.qr ? <img src={m.qr} /> : <Icon name="qr" size={18} />}</div>
                      <label className="upload-label">Upload<input type="file" accept="image/*" style={{ display: 'none' }} onChange={handleMobileQR(def.key)} /></label>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </Card>

      {form.bankEnabled !== false && (
        <Card className="card-pad">
          <h3 style={{ fontSize: 13.5, fontWeight: 700, margin: '0 0 16px' }}>Bank Details</h3>
          <div className="grid-form2">
            <Field label="Bank Name"><Input value={form.bankName} onChange={e => update('bankName', e.target.value)} /></Field>
            <Field label="Account Name"><Input value={form.accountName} onChange={e => update('accountName', e.target.value)} /></Field>
            <Field label="Account Number"><Input value={form.accountNumber} onChange={e => update('accountNumber', e.target.value)} /></Field>
            <Field label="Branch Name"><Input value={form.branchName} onChange={e => update('branchName', e.target.value)} /></Field>
            <Field label="Routing Number"><Input value={form.routingNumber} onChange={e => update('routingNumber', e.target.value)} /></Field>
            <div className="span-2"><Field label="Payment Instructions"><TextArea rows={2} value={form.paymentInstructions} onChange={e => update('paymentInstructions', e.target.value)} /></Field></div>
          </div>
        </Card>
      )}

      <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
        <Btn variant="primary" onClick={save}><Icon name="check" size={16} /> Save Settings</Btn>
      </div>
    </div>
  );
}

/* ---------------------------------- Invoice Form ---------------------------------- */

function InvoiceForm({ invoices, customers, products, settings, initial, onSave, onCancel, onQuickAddCustomer }) {
  const [form, setForm] = useState(() => initial || blankInvoice(invoices, settings));
  const [quickCustomer, setQuickCustomer] = useState(false);
  const update = (k, v) => setForm(f => ({ ...f, [k]: v }));

  const enabledMethods = useMemo(() => {
    const list = getEnabledPaymentMethods(settings);
    if (form.paymentMethod && !list.includes(form.paymentMethod)) list.push(form.paymentMethod);
    return list;
  }, [settings, form.paymentMethod]);

  const totals = useMemo(
    () => computeTotals(form.items, form.discount, form.deliveryCharge, form.additionalCharges, form.advancePaid),
    [form.items, form.discount, form.deliveryCharge, form.additionalCharges, form.advancePaid]
  );

  const selectCustomer = (id) => {
    const c = customers.find(c => c.id === id);
    update('customerId', id);
    if (c) update('customerSnapshot', { name: c.name, phone: c.phone, email: c.email, address: c.address });
  };
  const updateItem = (id, patch) => setForm(f => ({ ...f, items: f.items.map(it => it.id === id ? { ...it, ...patch } : it) }));
  const selectItemProduct = (id, productId) => {
    const p = products.find(p => p.id === productId);
    updateItem(id, p ? { productId, description: p.description || p.name, unitPrice: p.price } : { productId: '' });
  };
  const addItem = () => setForm(f => ({ ...f, items: [...f.items, { id: uid('it'), productId: '', description: '', qty: 1, unitPrice: 0 }] }));
  const removeItem = (id) => setForm(f => ({ ...f, items: f.items.length > 1 ? f.items.filter(it => it.id !== id) : f.items }));
  const selectDeliveryPreset = (presetId) => {
    const preset = DELIVERY_PRESETS.find(p => p.id === presetId);
    setForm(f => ({ ...f, deliveryPreset: presetId, deliveryCharge: presetId === 'custom' ? f.deliveryCharge : preset.amount }));
  };
  const handleSubmit = () => onSave({ ...form, subtotal: totals.subtotal, grandTotal: totals.grandTotal, dueAmount: totals.dueAmount });

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16, maxWidth: 920 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
        <button className="icon-btn" onClick={onCancel}><Icon name="arrowLeft" size={18} /></button>
        <h1 className="page-title" style={{ margin: 0 }}>{initial ? 'Edit Invoice' : 'Create Invoice'}</h1>
      </div>

      <Card className="card-pad">
        <div className="grid-form3">
          <Field label="Invoice Number"><Input value={form.invoiceNumber} disabled /></Field>
          <Field label="Invoice Date"><Input type="date" value={form.date} onChange={e => update('date', e.target.value)} /></Field>
          <Field label="Due Date"><Input type="date" value={form.dueDate} onChange={e => update('dueDate', e.target.value)} /></Field>
        </div>
      </Card>

      <Card className="card-pad">
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
          <h3 style={{ fontSize: 13.5, fontWeight: 700, margin: 0 }}>Billed To</h3>
          <button onClick={() => setQuickCustomer(true)} style={{ background: 'none', border: 'none', cursor: 'pointer', color: 'var(--accent)', fontSize: 12, fontWeight: 700, display: 'flex', alignItems: 'center', gap: 4 }}><Icon name="plus" size={14} /> New Customer</button>
        </div>
        <Field label="Select Customer">
          <Select value={form.customerId} onChange={e => selectCustomer(e.target.value)}>
            <option value="">-- Select a customer --</option>
            {customers.map(c => <option key={c.id} value={c.id}>{c.name}{c.phone ? ` (${c.phone})` : ''}</option>)}
          </Select>
        </Field>
        <div className="grid-form2" style={{ marginTop: 12 }}>
          <Field label="Name"><Input value={form.customerSnapshot.name} onChange={e => update('customerSnapshot', { ...form.customerSnapshot, name: e.target.value })} /></Field>
          <Field label="Phone"><Input value={form.customerSnapshot.phone} onChange={e => update('customerSnapshot', { ...form.customerSnapshot, phone: e.target.value })} /></Field>
          <Field label="Email"><Input value={form.customerSnapshot.email} onChange={e => update('customerSnapshot', { ...form.customerSnapshot, email: e.target.value })} /></Field>
          <Field label="Address"><Input value={form.customerSnapshot.address} onChange={e => update('customerSnapshot', { ...form.customerSnapshot, address: e.target.value })} /></Field>
        </div>
      </Card>

      <Card className="card-pad">
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
          <h3 style={{ fontSize: 13.5, fontWeight: 700, margin: 0 }}>Items</h3>
          <Btn variant="secondary" onClick={addItem}><Icon name="plus" size={14} /> Add Item</Btn>
        </div>
        {form.items.map(it => (
          <div key={it.id} className="item-row">
            <div className="col-4">
              <Label>Product</Label>
              <Select value={it.productId} onChange={e => selectItemProduct(it.id, e.target.value)}>
                <option value="">Custom item</option>
                {products.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
              </Select>
            </div>
            <div className="col-4">
              <Label>Description</Label>
              <Input value={it.description} onChange={e => updateItem(it.id, { description: e.target.value })} />
            </div>
            <div className="col-1">
              <Label>Qty</Label>
              <Input type="number" min="1" value={it.qty} onChange={e => updateItem(it.id, { qty: e.target.value })} />
            </div>
            <div className="col-2">
              <Label>Unit Price</Label>
              <Input type="number" value={it.unitPrice} onChange={e => updateItem(it.id, { unitPrice: e.target.value })} />
            </div>
            <div className="col-1" style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gridColumn: 'span 2' }}>
              <div>
                <Label>Amount</Label>
                <div style={{ fontSize: 13.5, fontWeight: 700, paddingTop: 7 }}>{formatBDT((Number(it.qty) || 0) * (Number(it.unitPrice) || 0))}</div>
              </div>
              <button className="icon-btn" style={{ color: 'var(--rose)' }} onClick={() => removeItem(it.id)}><Icon name="trash" size={14} /></button>
            </div>
          </div>
        ))}
      </Card>

      <Card className="card-pad">
        <h3 style={{ fontSize: 13.5, fontWeight: 700, margin: '0 0 12px' }}>Charges & Payment</h3>
        <div className="grid-form2">
          <Field label="Discount (BDT)"><Input type="number" value={form.discount} onChange={e => update('discount', e.target.value)} /></Field>
          <Field label="Additional Charges (BDT)"><Input type="number" value={form.additionalCharges} onChange={e => update('additionalCharges', e.target.value)} /></Field>

          <div className="span-2">
            <Label>Delivery Charge</Label>
            <div className="preset-row">
              {DELIVERY_PRESETS.map(p => (
                <button key={p.id} className={cx('preset-btn', form.deliveryPreset === p.id && 'active')} onClick={() => selectDeliveryPreset(p.id)}>
                  {p.label}{p.id !== 'custom' ? ` (${formatBDT(p.amount)})` : ''}
                </button>
              ))}
            </div>
            <Input type="number" value={form.deliveryCharge} disabled={form.deliveryPreset !== 'custom'} onChange={e => update('deliveryCharge', e.target.value)} />
          </div>

          <Field label="Advance Paid (BDT)"><Input type="number" value={form.advancePaid} onChange={e => update('advancePaid', e.target.value)} /></Field>
          <Field label="Payment Method">
            <Select value={form.paymentMethod} onChange={e => update('paymentMethod', e.target.value)}>
              {enabledMethods.map(m => <option key={m} value={m}>{m}</option>)}

          onSave={(data) => { const newC = onQuickAddCustomer(data); selectCustomer(newC.id); setQuickCustomer(false); }} />
      )}
    </div>
  );
}

function InvoiceDetailPage({ invoice, settings, onBack, onEdit, onDuplicate, onDelete, addToast }) {
  const [confirm, setConfirm] = useState(null);
  const previewRef = useRef(null);

  const handlePrint = () => {
    let styleTag = document.getElementById('print-scale-style');
    if (styleTag) styleTag.remove();
    const el = previewRef.current;
    const A4_HEIGHT_MM = 297;
    const PX_PER_MM = 96 / 25.4;
    let heightMm = A4_HEIGHT_MM;
    if (el) {
      const h = el.scrollHeight;
      const neededMm = Math.ceil(h / PX_PER_MM) + 4;
      heightMm = Math.max(A4_HEIGHT_MM, neededMm);
    }
    styleTag = document.createElement('style');
    styleTag.id = 'print-scale-style';
    styleTag.innerHTML = '@page{ size: 210mm ' + heightMm + 'mm; margin:0; }';
    document.head.appendChild(styleTag);
    setTimeout(() => window.print(), 30);
  };

  const handleShare = async () => {
    const text = `Invoice ${invoice.invoiceNumber}\n${settings.businessName}\nCustomer: ${invoice.customerSnapshot.name}\nTotal: ${formatBDT(invoice.grandTotal)}\nDue: ${formatBDT(invoice.dueAmount)}\nStatus: ${invoice.status}`;
    try {
      if (navigator.share) await navigator.share({ title: `Invoice ${invoice.invoiceNumber}`, text });
      else if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); addToast('Invoice summary copied to clipboard'); }
      else addToast('Sharing is not supported on this device', 'error');
    } catch (e) { addToast('Could not share invoice', 'error'); }
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div className="no-print" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <button className="icon-btn" onClick={onBack}><Icon name="arrowLeft" size={18} /></button>
          <h1 className="page-title" style={{ margin: 0, fontSize: 18 }}>{invoice.invoiceNumber}</h1>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
          <Btn variant="secondary" onClick={() => onEdit(invoice.id)}><Icon name="edit" size={15} /> Edit</Btn>
          <Btn variant="secondary" onClick={() => onDuplicate(invoice.id)}><Icon name="copy" size={15} /> Duplicate</Btn>
          <Btn variant="secondary" onClick={handleShare}><Icon name="share" size={15} /> Share</Btn>
          <Btn variant="secondary" onClick={handlePrint}><Icon name="printer" size={15} /> Print</Btn>
          <Btn variant="primary" onClick={handlePrint}><Icon name="download" size={15} /> Download PDF</Btn>
          <Btn variant="danger" onClick={() => setConfirm({ message: `Delete invoice ${invoice.invoiceNumber}? This cannot be undone.`, onConfirm: () => onDelete(invoice.id) })}><Icon name="trash" size={15} /></Btn>
        </div>
      </div>
      <div ref={previewRef} className="print-scale-wrap">
        <InvoicePreview invoice={invoice} settings={settings} />
      </div>
      <ConfirmModal data={confirm} onClose={() => setConfirm(null)} />
    </div>
  );
}

function BulkExportStage({ queue, settings, onDone }) {
  const indexRef = useRef(0);

  useEffect(() => {
    if (!queue || queue.length === 0) { onDone(); return; }
    indexRef.current = 0;
    processNext();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [queue]);

  function processNext() {
    if (indexRef.current >= queue.length) { onDone(); return; }
    const inv = queue[indexRef.current];
    const tempDiv = document.createElement('div');
    const root = ReactDOM.createRoot(tempDiv);
    root.render(<InvoicePreview invoice={inv} settings={settings} />);
    setTimeout(() => {
      const previewEl = tempDiv.querySelector('.invoice-preview');
      const contentHeightPx = previewEl ? previewEl.scrollHeight : 0;
      const html = buildPrintHTML(tempDiv.innerHTML, inv.invoiceNumber, contentHeightPx);
      const win = window.open('', '_blank');
      if (win) {
        win.document.open();
        win.document.write(html);
        win.document.close();
        win.focus();
        setTimeout(() => { try { win.print(); } catch (e) {} }, 350);
      }
      root.unmount();
      indexRef.current += 1;
      setTimeout(processNext, 500);
    }, 60);
  }

  return <div className="bulk-export-stage" aria-hidden="true"></div>;
}

/* ---------------------------------- Invoices List ---------------------------------- */

function InvoicesListPage({ invoices, customers, onView, onEdit, onDuplicate, onDelete, onNew, settings, addToast }) {
  const [search, setSearch] = useState('');
  const [statusFilter, setStatusFilter] = useState('All');
  const [customerFilter, setCustomerFilter] = useState('All');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [confirm, setConfirm] = useState(null);
  const [selectedIds, setSelectedIds] = useState(() => new Set());
  const [exportQueue, setExportQueue] = useState(null);

  const filtered = invoices
    .filter(inv => inv.invoiceNumber.toLowerCase().includes(search.toLowerCase()) || (inv.customerSnapshot.name || '').toLowerCase().includes(search.toLowerCase()))
    .filter(inv => statusFilter === 'All' || inv.status === statusFilter)
    .filter(inv => customerFilter === 'All' || inv.customerId === customerFilter)
    .filter(inv => !dateFrom || inv.date >= dateFrom)
    .filter(inv => !dateTo || inv.date <= dateTo)
    .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

  useEffect(() => {
    setSelectedIds(prev => {
      const next = new Set();
      prev.forEach(id => { if (invoices.some(i => i.id === id)) next.add(id); });
      return next;
    });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [invoices.length]);

  const allFilteredSelected = filtered.length > 0 && filtered.every(inv => selectedIds.has(inv.id));

  function toggleOne(id) {
    setSelectedIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }
  function toggleAllFiltered() {
    setSelectedIds(prev => {
      const next = new Set(prev);
      if (allFilteredSelected) {
        filtered.forEach(inv => next.delete(inv.id));
      } else {
        filtered.forEach(inv => next.add(inv.id));
      }
      return next;
    });
  }
  function clearSelection() { setSelectedIds(new Set()); }

  function exportSelected() {
    const toExport = invoices.filter(inv => selectedIds.has(inv.id));
    if (toExport.length === 0) {
      addToast('Select at least one invoice to export', 'error');
      return;
    }
    addToast(`Exporting ${toExport.length} invoice${toExport.length > 1 ? 's' : ''} as PDF...`);
    setExportQueue(toExport);
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12 }}>
        <h1 className="page-title">Invoices</h1>
        <Btn variant="primary" onClick={onNew}><Icon name="plus" size={16} /> New Invoice</Btn>
      </div>

      <Card className="card-pad" style={{ padding: 14 }}>
        <div className="filters-bar">
          <div className="search-wrap">
            <span className="search-icon"><Icon name="search" size={15} /></span>
            <Input placeholder="Search invoice or customer..." value={search} onChange={e => setSearch(e.target.value)} />
          </div>
          <Select value={statusFilter} onChange={e => setStatusFilter(e.target.value)}>
            <option value="All">All Statuses</option>
            {STATUS_LIST.map(s => <option key={s} value={s}>{s}</option>)}
          </Select>
          <Select value={customerFilter} onChange={e => setCustomerFilter(e.target.value)}>
            <option value="All">All Customers</option>
            {customers.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
          </Select>
          <div style={{ display: 'flex', gap: 6 }}>
            <Input type="date" value={dateFrom} onChange={e => setDateFrom(e.target.value)} />
            <Input type="date" value={dateTo} onChange={e => setDateTo(e.target.value)} />
          </div>
        </div>
      </Card>

      {selectedIds.size > 0 && (
        <div className="bulk-bar no-print">
          <div className="bulk-bar-left">
            <Icon name="checkCircle" size={16} />
            {selectedIds.size} invoice{selectedIds.size > 1 ? 's' : ''} selected
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <Btn variant="secondary" onClick={clearSelection}>Clear</Btn>
            <Btn variant="primary" onClick={exportSelected}><Icon name="download" size={15} /> Export Selected as PDF</Btn>
          </div>
        </div>
      )}

      {filtered.length === 0
        ? <EmptyState icon="invoice" title="No invoices found" subtitle="Create your first invoice to get started" />
        : <Card style={{ overflow: 'hidden' }}>
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th style={{ width: 36 }}>
                      <input
                        type="checkbox"
                        className="select-checkbox"
                        checked={allFilteredSelected}
                        onChange={toggleAllFiltered}
                        title="Select all (filtered)"
                      />
                    </th>
                    {['Invoice #', 'Customer', 'Date', 'Total', 'Due', 'Status', ''].map(h => <th key={h}>{h}</th>)}
                  </tr>
                </thead>
                <tbody>
                  {filtered.map(inv => (
                    <tr key={inv.id} style={selectedIds.has(inv.id) ? { background: 'var(--accent-light)' } : undefined}>
                      <td>
                        <input
                          type="checkbox"
                          className="select-checkbox"
                          checked={selectedIds.has(inv.id)}
                          onChange={() => toggleOne(inv.id)}
                        />
                      </td>
                      <td style={{ fontWeight: 600, cursor: 'pointer' }} onClick={() => onView(inv.id)}>{inv.invoiceNumber}</td>
                      <td>{inv.customerSnapshot.name || '—'}</td>
                      <td style={{ color: 'var(--text-dim)' }}>{formatDateDisplay(inv.date)}</td>
                      <td style={{ fontWeight: 700 }}>{formatBDT(inv.grandTotal)}</td>
                      <td style={{ fontWeight: 600, color: 'var(--rose)' }}>{formatBDT(inv.dueAmount)}</td>
                      <td><Badge status={inv.status} /></td>
                      <td>
                        <div className="row-actions">
                          <button className="icon-btn" onClick={() => onEdit(inv.id)}><Icon name="edit" size={14} /></button>
                          <button className="icon-btn" onClick={() => onDuplicate(inv.id)}><Icon name="copy" size={14} /></button>
                          <button className="icon-btn" style={{ color: 'var(--rose)' }} onClick={() => setConfirm({ message: `Delete invoice ${inv.invoiceNumber}?`, onConfirm: () => onDelete(inv.id) })}><Icon name="trash" size={14} /></button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>}
      <ConfirmModal data={confirm} onClose={() => setConfirm(null)} />

      {exportQueue && (
        <BulkExportStage
          queue={exportQueue}
          settings={settings}
          onDone={() => setExportQueue(null)}
        />
      )}
    </div>
  );
}

/* ---------------------------------- App (root) ---------------------------------- */

function App() {
  const [loaded, setLoaded] = useState(false);
  const [dark, setDark] = useState(false);
  const [view, setView] = useState('dashboard');
  const [mobileOpen, setMobileOpen] = useState(false);

  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [customers, setCustomers] = useState([]);
  const [products, setProducts] = useState(DEFAULT_PRODUCTS);
  const [invoices, setInvoices] = useState([]);

  const [editingId, setEditingId] = useState(null);
  const [duplicateFrom, setDuplicateFrom] = useState(null);
  const [viewingId, setViewingId] = useState(null);
  const [toasts, setToasts] = useState([]);
  const [cloudStatus, setCloudStatus] = useState(null);

  useEffect(() => {
    const t = setInterval(() => setCloudStatus(storageAdapter.getCloudStatus()), 2500);
    return () => clearInterval(t);
  }, []);

  const addToast = (message, type = 'success') => {
    const id = uid('t');
    setToasts(t => [...t, { id, message, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
  };

  useEffect(() => {
    (async () => {
      try {
        const [s, c, p, i, th] = await Promise.all([
          storageAdapter.get(STORAGE_KEYS.settings),
          storageAdapter.get(STORAGE_KEYS.customers),
          storageAdapter.get(STORAGE_KEYS.products),
          storageAdapter.get(STORAGE_KEYS.invoices),
          storageAdapter.get(STORAGE_KEYS.theme)
        ]);
        if (s) setSettings(mergeSettings(JSON.parse(s.value)));
        if (c) setCustomers(JSON.parse(c.value));
        if (p) setProducts(JSON.parse(p.value));
        if (i) setInvoices(JSON.parse(i.value));
        if (th) setDark(th.value === 'dark');
      } catch (e) { console.error('Load error', e); }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => { if (loaded) storageAdapter.set(STORAGE_KEYS.settings, JSON.stringify(settings)); }, [settings, loaded]);
  useEffect(() => { if (loaded) storageAdapter.set(STORAGE_KEYS.customers, JSON.stringify(customers)); }, [customers, loaded]);
  useEffect(() => { if (loaded) storageAdapter.set(STORAGE_KEYS.products, JSON.stringify(products)); }, [products, loaded]);
  useEffect(() => { if (loaded) storageAdapter.set(STORAGE_KEYS.invoices, JSON.stringify(invoices)); }, [invoices, loaded]);
  useEffect(() => { if (loaded) storageAdapter.set(STORAGE_KEYS.theme, dark ? 'dark' : 'light'); }, [dark, loaded]);
  useEffect(() => { document.documentElement.classList.toggle('dark', dark); }, [dark]);

  const addCustomer = (data) => { const c = { id: uid('cust'), ...data }; setCustomers(cs => [...cs, c]); addToast('Customer added'); return c; };
  const updateCustomer = (data) => { setCustomers(cs => cs.map(c => c.id === data.id ? data : c)); addToast('Customer updated'); };
  const deleteCustomer = (id) => { setCustomers(cs => cs.filter(c => c.id !== id)); addToast('Customer deleted'); };

  const addProduct = (data) => { setProducts(ps => [...ps, { id: uid('prod'), ...data }]); addToast('Product added'); };
  const updateProduct = (data) => { setProducts(ps => ps.map(p => p.id === data.id ? data : p)); addToast('Product updated'); };
  const deleteProduct = (id) => { setProducts(ps => ps.filter(p => p.id !== id)); addToast('Product deleted'); };

  const goNewInvoice = () => { setEditingId(null); setDuplicateFrom(null); setView('form'); };
  const goEditInvoice = (id) => { setEditingId(id); setDuplicateFrom(null); setView('form'); };
  const goViewInvoice = (id) => { setViewingId(id); setView('detail'); };

  const saveInvoice = (data) => {
    if (data.id) {
      setInvoices(invs => invs.map(i => i.id === data.id ? data : i));
      addToast('Invoice updated'); setViewingId(data.id);
    } else {
      const newInv = { ...data, id: uid('inv'), createdAt: new Date().toISOString() };
      setInvoices(invs => [...invs, newInv]);
      addToast('Invoice created'); setViewingId(newInv.id);
    }
    setView('detail');
  };
  const deleteInvoice = (id) => {
    setInvoices(invs => invs.filter(i => i.id !== id));
    addToast('Invoice deleted');
    if (viewingId === id) setView('invoices');
  };
  const duplicateInvoice = (id) => {
    const src = invoices.find(i => i.id === id);
    if (!src) return;
    const dup = { ...src, id: null, invoiceNumber: generateInvoiceNumber(invoices), date: todayISO(), status: 'Draft', advancePaid: 0, items: src.items.map(it => ({ ...it, id: uid('it') })) };
    setEditingId(null); setDuplicateFrom(dup); setView('form');
  };
  const quickAddCustomerFromForm = (data) => addCustomer(data);

  const currentInvoiceForForm = editingId ? invoices.find(i => i.id === editingId) : duplicateFrom;
  const viewingInvoice = invoices.find(i => i.id === viewingId);

  if (!loaded) return <div className="loading-screen">Loading...</div>;

  return (
    <div className="app">
      <Sidebar
        view={view} setView={(v) => { setView(v); setMobileOpen(false); }}
        onNewInvoice={goNewInvoice} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen}
        toggleDark={() => setDark(d => !d)} dark={dark} cloudStatus={cloudStatus}
      />
      <main className="content">
        {view === 'dashboard' && <Dashboard invoices={invoices} />}
        {view === 'invoices' && (
          <InvoicesListPage invoices={invoices} customers={customers} onView={goViewInvoice} onEdit={goEditInvoice} onDuplicate={duplicateInvoice} onDelete={deleteInvoice} onNew={goNewInvoice} settings={settings} addToast={addToast} />
        )}
        {view === 'customers' && <CustomersPage customers={customers} onAdd={addCustomer} onUpdate={updateCustomer} onDelete={deleteCustomer} />}
        {view === 'products' && <ProductsPage products={products} onAdd={addProduct} onUpdate={updateProduct} onDelete={deleteProduct} />}
        {view === 'settings' && <SettingsPage settings={settings} onSave={setSettings} addToast={addToast} />}
        {view === 'form' && (
          <InvoiceForm key={editingId || (duplicateFrom ? 'dup' : 'new')} invoices={invoices} customers={customers} products={products} settings={settings}
            initial={currentInvoiceForForm} onSave={saveInvoice} onCancel={() => setView(editingId ? 'detail' : 'invoices')} onQuickAddCustomer={quickAddCustomerFromForm} />
        )}
        {view === 'detail' && viewingInvoice && (
          <InvoiceDetailPage invoice={viewingInvoice} settings={settings} onBack={() => setView('invoices')} onEdit={goEditInvoice} onDuplicate={duplicateInvoice} onDelete={deleteInvoice} addToast={addToast} />
        )}
      </main>
      <ToastStack toasts={toasts} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
